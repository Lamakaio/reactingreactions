plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseForge"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    // Registrate - needed at compile time for this mod's own Create block/item/
    // fluid registrations (CRRRegistrate); the actual runtime copy is already
    // provided via Create's jarJar-embedded one. This is the same repo Create's
    // own build.gradle declares for it.
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    // JEI, for testing recipes in-game.
    maven { url = "https://maven.blamejared.com" }
    // Accessories + its owo-lib dependency (optional accessory slots).
    maven { url = "https://maven.wispforest.io/releases" }
    // Curios (optional accessory slots, the alternative to Accessories).
    maven { url = "https://maven.theillusivec4.top/" }
    // Sinytra's "forgified-fabric-api" - a transitive dependency of Accessories/owo.
    maven { url = "https://maven.su5ed.dev/releases" }
    // Jade (compile only): the overlay plugin in content/compat. Modrinth's Maven serves it.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // Ponder - needed at compile time only, to subclass Create's SmartBlockEntity
    // (via Aeronautics' HotAirBurnerBlockEntity) for the Helium/Hydrogen burners.
    // Already present at runtime via Create's own jarJar-embedded copy.
    maven { url = "https://maven.createmod.net" }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Rebuilds the Ponder schematics (see PonderSchematicExporter) in a throwaway flat world, then stops.
        exportPonder {
            server()
            gameDirectory = project.file('run-ponder')
            programArgument '--nogui'
            systemProperty 'reactingreactions.exportPonder', file('src/main/resources/assets/reactingreactions/ponder').getAbsolutePath()
        }

        // Builds the showcase world (see ShowcaseWorldBuilder) into run-showcase/showcase, runs it a few minutes, then stops.
        showcase {
            server()
            gameDirectory = project.file('run-showcase')
            programArgument '--nogui'
            // How long the factory runs before saving, in seconds (-PshowcaseSeconds=30 for a quick check).
            systemProperty 'reactingreactions.buildShowcase', (project.findProperty('showcaseSeconds') ?: '240').toString()
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'create'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional mods: compiled against, and only on the dev runtime for testing.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:emi:${emi_version}"
    localRuntime "maven.modrinth:emi:${emi_version}"
    compileOnly "maven.modrinth:jade:eYz2YBGT"
    localRuntime "maven.modrinth:jade:eYz2YBGT"

    // Create 6.0.10: Sable's mixins into Create need it.
    implementation "curse.maven:create-328085:7963363"
    // Aeronautics 1.3.2, whose modules need Sable 2.x.
    implementation "curse.maven:create-aeronautics-676721:8763471"
    // Sable, required by Aeronautics' modules. The NeoForge build.
    implementation "curse.maven:sable-1312371:8673825"
    // Electro Energetics autobuild 132, not on any maven. To update:
    // gh release download autobuild-<n> -R george8188625/Create-Electro-Energetics -D libs
    implementation files("libs/electroenergetics-1.21.1-1.2.0-132.jar")
    // Accessory slots: Accessories or Curios, both optional (see WornAccessories). Only one is on the dev runtime,
    // picked with -Paccessory_mod=accessories|curios|none.
    compileOnly "io.wispforest:accessories-neoforge:1.1.0-beta.53+1.21.1"
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    def accessoryMod = project.findProperty("accessory_mod") ?: "accessories"
    if (accessoryMod == "curios") {
        localRuntime "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    } else if (accessoryMod == "accessories") {
        localRuntime "io.wispforest:accessories-neoforge:1.1.0-beta.53+1.21.1"
        localRuntime "io.wispforest:owo-lib-neoforge:0.12.15.1-beta.6+1.21"
    }

    // Only integrated through data and ModList checks, so runtime only.
    localRuntime "maven.modrinth:create-diesel-generators:UoPH8lO1"
    // KubeJS reads our recipe schemas; KubeJS Create provides the component types they use.
    localRuntime "maven.modrinth:rhino:SqkDvOLG"
    localRuntime "maven.modrinth:kubejs:F2nzeC19"
    localRuntime "maven.modrinth:kubejs-create:1qmcLagN"

    // The usual performance mods, in the dev runs both for speed and to test compatibility with them.
    // -Pperf_mods=false runs without them, to compare frame rates and to rule them out of a bug. Datagen leaves them out by
    // default: it needs none of them, and the client ones make its mod-loading deadlock more likely.
    def datagen = gradle.startParameter.taskNames.any { it.contains("runData") }
    if ((project.findProperty("perf_mods") ?: (!datagen).toString()).toString().toBoolean()) {
        localRuntime "maven.modrinth:sodium:mc1.21.1-0.8.13-neoforge"
        localRuntime "maven.modrinth:lithium:mc1.21.1-0.15.4-neoforge"
        localRuntime "maven.modrinth:ferrite-core:7.0.3-neoforge"
        localRuntime "maven.modrinth:modernfix:5.27.24+mc1.21.1"
        localRuntime "maven.modrinth:immediatelyfast:1.6.14+1.21.1-neoforge"
        // By version id: "1.11.2" also names the Fabric build.
        localRuntime "maven.modrinth:entityculling:8w8FfUPs"
    }
    // Profiler: /spark profiler start, then /spark profiler stop for a report link.
    localRuntime "maven.modrinth:spark:v5qtqRQi"

    // Create embeds Registrate, so it must not be loaded twice.
    compileOnly "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"

    // Aeronautics' modules and Create's Flywheel are embedded jars, only visible to the compiler once extracted.
    compileOnly fileTree(dir: layout.buildDirectory.dir("aeronautics-submodules").get(), include: "*.jar")
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    compileOnly fileTree(dir: layout.buildDirectory.dir("create-submodules").get(), include: "*.jar")
}

def aeronauticsShellJar = configurations.detachedConfiguration(
        dependencies.create("curse.maven:create-aeronautics-676721:8763471")
).resolve().first()

tasks.register("extractAeronauticsSubmodules", Copy) {
    from(zipTree(aeronauticsShellJar)) {
        include "META-INF/jarjar/*.jar"
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir("aeronautics-submodules")
}

// Flywheel is jarjar-embedded inside Create the same way; Create's GuiGameElement
// (used by the JEI structure preview) needs its PartialModel class to compile against.
def createJar = configurations.detachedConfiguration(
        dependencies.create("curse.maven:create-328085:7963363")
).resolve().first()

tasks.register("extractCreateSubmodules", Copy) {
    from(zipTree(createJar)) {
        include "META-INF/jarjar/flywheel-*.jar"
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir("create-submodules")
}

// The export run's world is thrown away each time: a fresh flat world, EULA accepted, nothing spawning.
tasks.matching { it.name == "runExportPonder" }.configureEach {
    def dir = file('run-ponder')
    doFirst {
        new File(dir, 'world').deleteDir()
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = 'level-type=minecraft\\:flat\nspawn-monsters=false\nspawn-animals=false\nonline-mode=false\n'
    }
}

// A fresh superflat world each time: 40 layers of stone under the grass, deep enough for the Derrick to drill.
tasks.matching { it.name == "runShowcase" }.configureEach {
    def dir = file('run-showcase')
    doFirst {
        new File(dir, 'showcase').deleteDir()
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        def layers = '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":40},' +
                '{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains",' +
                '"features":false,"lakes":false,"structure_overrides":[]}'
        new File(dir, 'server.properties').text = 'level-name=showcase\nlevel-type=minecraft\\:flat\ngenerator-settings=' + layers +
                '\ngamemode=creative\nspawn-monsters=false\nspawn-animals=false\nspawn-protection=0\nonline-mode=false\n'
    }
}

tasks.named("compileJava") { dependsOn "extractAeronauticsSubmodules", "extractCreateSubmodules" }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
